name: Repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  structure-and-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check result ownership and navigation
        run: python scripts/validate_repo.py
      - name: Package the canonical Overleaf source
        run: python scripts/package_overleaf.py
      - name: Replay exact finite certificates
        run: python proofs/lean/certificates/verify_all.py
      - name: Save the Overleaf export
        uses: actions/upload-artifact@v4
        with:
          name: overleaf
          path: dist/overleaf.zip
  paper-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the paper's TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
      - name: Compile and check the canonical paper
        run: python scripts/build_paper.py
      - name: Save the compiled paper and source fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: |
            dist/quantum-switch-paper.pdf
            dist/paper-build.json
          if-no-files-found: error
