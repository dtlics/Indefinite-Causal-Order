name: Integrate application-search sources
on:
  push:
    branches: [sync/application-search-2026]
permissions:
  contents: write
concurrency:
  group: integrate-application-search
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[integrate-application-search]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/application-search-2026
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and symbolic check dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy sympy threadpoolctl
      - name: Materialize verified sources, integrate owners and run checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/_integrate_application_search.py
      - name: Commit clean sources and validation record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md docs/VALIDATION.md research scripts/_integrate_application_search.py .github/workflows/integrate-application-search.yml
          git commit -m 'Sync application-search results, baselines and reproducible checks'
          git push origin HEAD:sync/application-search-2026
      - name: Save check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-search-validation
          path: _build/application-search/
